server {
    listen 80;
    server_name _;

    root /var/www/shop;
    index index.html;

    location /api/products {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/shop-proxy.conf;
    }

    location /api/cart {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/shop-proxy.conf;
    }

    location /api/orders {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/shop-proxy.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
